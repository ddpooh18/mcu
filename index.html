<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU 漫威電影觀影清單</title>
  <style>
    :root {
      --bg-main: #0f1015;
      --card-bg: #1a1c23;
      --accent-red: #e50914;
      --accent-gold: #f5c518;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --border: #2e323d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 20px 15px 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--accent-red);
      font-size: 2.2rem;
      margin: 0 0 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* 進度條樣式 */
    .progress-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .progress-bar-bg {
      background: #2a2d37;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* 篩選按鈕 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    /* 卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .card.watched {
      border-color: var(--accent-gold);
    }

    .poster-container {
      position: relative;
      width: 100%;
      padding-top: 145%; /* 1:1.45 海報比例 */
      background: #000;
      overflow: hidden;
    }

    .poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .poster-img {
      transform: scale(1.04);
    }

    .phase-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .watched-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-gold);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
    }

    .card.watched .watched-tag {
      display: block;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .release-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .toggle-details-btn {
      background: #262933;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      margin-top: auto;
      transition: background 0.2s;
    }

    .toggle-details-btn:hover {
      background: #333745;
    }

    .details-form {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
    }

    .details-form.open {
      display: flex;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent-red);
      width: 16px;
      height: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="date"], textarea {
      background: #111217;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .save-btn {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent-gold);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MARVEL CINEMATIC UNIVERSE</h1>
      <div class="subtitle">大小姐的 MCU 觀影與心得日誌</div>
    </header>

    <div class="progress-box">
      <div class="progress-info">
        <span>MCU 電影完成度</span>
        <span id="progressText">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterMovies('all', this)">全部作品</button>
      <button class="filter-btn" onclick="filterMovies('unwatched', this)">待觀看</button>
      <button class="filter-btn" onclick="filterMovies('watched', this)">已觀看</button>
    </div>

    <div class="grid" id="movieGrid"></div>
  </div>

  <div id="toast" class="toast">紀錄已成功更新！</div>

  <script>

      { id: "m9", title: "美國隊長 2：酷寒戰士", date: "2014-03-27", phase: "Phase 2", poster: "https://image.tmdb.org/t/p/w500/71D0gE2S6c9vG834uK0b4C4g55d.jpg" },
      { id: "m10", title: "星際異攻隊", date: "2014-07-31", phase: "Phase 2", poster: "https://image.tmdb.org/t/p/w500/r7A0sE25S1c4G0b81A5U245e31g.jpg" },

      // Phase 3
      { id: "m13", title: "美國隊長 3：英雄內戰", date: "2016-04-27", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/rAGI1fC2366mR33M9959fE2e33.jpg" },
      { id: "m14", title: "奇異博士", date: "2016-10-25", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/uGB233c9959fE2e33rAGI1fC2.jpg" },
      { id: "m15", title: "星際異攻隊 2", date: "2017-04-26", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/y4G233c9959fE2e33rAGI1fC2.jpg" },
      { id: "m16", title: "蜘蛛人：返校日", date: "2017-07-05", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/c242e33rAGI1fC2y4G233c9959.jpg" },
      { id: "m17", title: "雷神索爾 3：諸神黃昏", date: "2017-10-26", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/ebfR233c9959fE2e33rAGI1fC2.jpg" },
      { id: "m18", title: "黑豹", date: "2018-02-13", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/ux233c9959fE2e33rAGI1fC2ebf.jpg" },
      { id: "m19", title: "復仇者聯盟 3：無限之戰", date: "2018-04-25", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/7WsyChLLEz3339_aB0C0d0.jpg" },
      { id: "m20", title: "蟻人與黃蜂女", date: "2018-07-04", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/39fE2e33rAGI1fC2ebfR233c99.jpg" },
      { id: "m21", title: "驚奇隊長", date: "2019-03-06", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/A00e33rAGI1fC2ebfR233c9959.jpg" },
      { id: "m22", title: "復仇者聯盟 4：終局之戰", date: "2019-04-24", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/or06FN3395829e2e33rAGI1fC2.jpg" },
      { id: "m23", title: "蜘蛛人：離家日", date: "2019-07-03", phase: "Phase 3", poster: "https://image.tmdb.org/t/p/w500/4E2e33rAGI1fC2ebfR233c9959.jpg" },
      // Phase 4
      { id: "m24", title: "黑寡婦", date: "2021-07-14", phase: "Phase 4", poster: "https://image.tmdb.org/t/p/w500/qAZ093e2e33rAGI1fC2ebfR233.jpg" },

      { id: "m28", title: "奇異博士 2：失控多重宇宙", date: "2022-05-04", phase: "Phase 4", poster: "https://image.tmdb.org/t/p/w500/9G2e33rAGI1fC2ebfR233c9959f.jpg" },
      { id: "m29", title: "雷神索爾 4：愛與雷霆", date: "2022-07-06", phase: "Phase 4", poster: "https://image.tmdb.org/t/p/w500/pE2e33rAGI1fC2ebfR233c9959fE.jpg" },
      { id: "m30", title: "黑豹 2：瓦干達萬歲", date: "2022-11-09", phase: "Phase 4", poster: "https://image.tmdb.org/t/p/w500/ps2e33rAGI1fC2ebfR233c9959fE2.jpg" },
      // Phase 5
      { id: "m31", title: "蟻人與黃蜂女：量子狂熱", date: "2023-02-15", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/qn1S233c9959fE2e33rAGI1fC2.jpg" },
      { id: "m32", title: "星際異攻隊 3", date: "2023-05-03", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/r233c9959fE2e33rAGI1fC2ebfR.jpg" },
      { id: "m33", title: "驚奇隊長 2", date: "2023-11-08", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/Ag233c9959fE2e33rAGI1fC2ebf.jpg" },
      { id: "m34", title: "死侍與狼人", date: "2024-07-24", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/8cdWjvB233c9959fE2e33rAGI1f.jpg" },
      { id: "m35", title: "美國隊長：無畏新世界", date: "2025-02-14", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/pz233c9959fE2e33rAGI1fC2ebf.jpg" },
      { id: "m36", title: "雷霆特攻隊*", date: "2025-05-02", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/t233c9959fE2e33rAGI1fC2ebfR2.jpg" },
      // Phase 6
      { id: "m37", title: "驚奇4超人：第一步", date: "2025-07-25", phase: "Phase 6", poster: "https://image.tmdb.org/t/p/w500/f233c9959fE2e33rAGI1fC2ebfR2.jpg" },
      { id: "m38", title: "復仇者聯盟：末日", date: "2026-05-01", phase: "Phase 6", poster: "https://image.tmdb.org/t/p/w500/a233c9959fE2e33rAGI1fC2ebfR2.jpg" }
    ];

    let currentFilter = 'all';

    function loadUserData() {
      const saved = localStorage.getItem('mcu_watchlist_v2');
      return saved ? JSON.parse(saved) : {};
    }

    function updateProgress() {
      const userData = loadUserData();
      const total = moviesData.length;
      let watchedCount = 0;

      moviesData.forEach(m => {
        if (userData[m.id] && userData[m.id].watched) {
          watchedCount++;
        }
      });

      const percentage = Math.round((watchedCount / total) * 100);
      document.getElementById('progressText').innerText = `${watchedCount} / ${total} (${percentage}%)`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function saveMovieRecord(movieId) {
      const isWatched = document.getElementById(`check-${movieId}`).checked;
      const watchDate = document.getElementById(`date-${movieId}`).value;
      const notes = document.getElementById(`notes-${movieId}`).value;

      const userData = loadUserData();
      userData[movieId] = {
        watched: isWatched,
        date: watchDate,
        notes: notes
      };

      localStorage.setItem('mcu_watchlist_v2', JSON.stringify(userData));
      
      const card = document.getElementById(`card-${movieId}`);
      if (isWatched) {
        card.classList.add('watched');
      } else {
        card.classList.remove('watched');
      }

      showToast();
      updateProgress();
    }

    function toggleForm(movieId) {
      const form = document.getElementById(`form-${movieId}`);
      form.classList.toggle('open');
    }

    function renderMovies() {
      const grid = document.getElementById('movieGrid');
      const userData = loadUserData();
      grid.innerHTML = '';

      moviesData.forEach(movie => {
        const record = userData[movie.id] || { watched: false, date: '', notes: '' };
        
        if (currentFilter === 'watched' && !record.watched) return;
        if (currentFilter === 'unwatched' && record.watched) return;

        // 生成海報的備用占位圖邏輯
        const posterSrc = movie.poster;

        const card = document.createElement('div');
        card.className = `card ${record.watched ? 'watched' : ''}`;
        card.id = `card-${movie.id}`;

        card.innerHTML = `
          <div class="poster-container">
            <img src="${posterSrc}" class="poster-img" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x440/1a1c23/ffffff?text=${encodeURIComponent(movie.title)}'">
            <span class="phase-badge">${movie.phase}</span>
            <span class="watched-tag">✓ 已觀看</span>
          </div>
          <div class="card-content">
            <div class="card-title">${movie.title}</div>
            <div class="release-date">${movie.date} 上映</div>
            <button class="toggle-details-btn" onclick="toggleForm('${movie.id}')">紀錄 / 心得 ✎</button>
            <div class="details-form" id="form-${movie.id}">
              <label class="checkbox-label">
                <input type="checkbox" id="check-${movie.id}" ${record.watched ? 'checked' : ''}>
                已標記為已觀看
              </label>
              <div class="form-group">
                <label>觀看日期</label>
                <input type="date" id="date-${movie.id}" value="${record.date}">
              </div>
              <div class="form-group">
                <label>觀後感紀錄</label>
                <textarea id="notes-${movie.id}" placeholder="寫下當時的心得...">${record.notes}</textarea>
              </div>
              <button class="save-btn" onclick="saveMovieRecord('${movie.id}')">儲存紀錄</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      updateProgress();
    }

    function filterMovies(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    renderMovies();
  </script>
</body>
</html>
