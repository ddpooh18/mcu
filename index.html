<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU 漫威電影宇宙觀影紀錄</title>
  <style>
    :root {
      --bg-main: #0b0c10;
      --card-bg: #151720;
      --accent-red: #e50914;
      --accent-gold: #f5c518;
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
      --border: #262936;

      /* 各階段顏色定義 */
      --color-p1: #ff4d4d;
      --color-p2: #ff9f1c;
      --color-p3: #2ec4b6;
      --color-p4: #9b5de5;
      --color-p5: #00bbf9;
      --color-p6: #f3c623;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 20px 15px 60px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--accent-red);
      font-size: 2.2rem;
      margin: 0 0 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* 全局進度條 */
    .progress-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 30px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .progress-bar-bg {
      background: #202330;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* 篩選按鈕 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    /* 階段分區標題 */
    .phase-section {
      margin-bottom: 40px;
    }

    .phase-title {
      font-size: 1.4rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    .phase-title-tag {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      color: #000;
      font-weight: 800;
    }

    /* 各階段顏色設定 */
    .p1 { background-color: var(--color-p1); color: #fff; }
    .p2 { background-color: var(--color-p2); color: #000; }
    .p3 { background-color: var(--color-p3); color: #000; }
    .p4 { background-color: var(--color-p4); color: #fff; }
    .p5 { background-color: var(--color-p5); color: #000; }
    .p6 { background-color: var(--color-p6); color: #000; }

    /* 卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.6);
    }

    .card.watched {
      border-color: var(--accent-gold);
    }

    /* 海報區域 */
    .poster-container {
      position: relative;
      width: 100%;
      padding-top: 148%;
      background: #000;
      overflow: hidden;
    }

    .poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .poster-img {
      transform: scale(1.05);
    }

    /* 左上角 Phase 標籤 */
    .phase-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .watched-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-gold);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      z-index: 2;
    }

    .card.watched .watched-tag {
      display: block;
    }

    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .release-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .toggle-details-btn {
      background: #202330;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      width: 100%;
      margin-top: auto;
      transition: background 0.2s;
    }

    .toggle-details-btn:hover {
      background: #2a2e40;
    }

    .details-form {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
    }

    .details-form.open {
      display: flex;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent-red);
      width: 16px;
      height: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="date"], textarea {
      background: #0f1015;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .save-btn {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.82rem;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent-gold);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 100;
    }
  </style>

      { id: "m53", title: "美國隊長：無畏新世界", date: "2025-02-14", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/pz233c9959fE2e33rAGI1fC2ebf.jpg" },
      { id: "m54", title: "夜魔俠：重生 第一季", date: "2025-03-04", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/dd233c9959fE2e33rAGI1fC2ebfR.jpg" },
      { id: "m55", title: "雷霆特攻隊*", date: "2025-05-02", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/t233c9959fE2e33rAGI1fC2ebfR2.jpg" },
      { id: "m56", title: "驚奇 4 超人：第一步", date: "2025-07-25", phase: "Phase 5", poster: "https://image.tmdb.org/t/p/w500/f233c9959fE2e33rAGI1fC2ebfR2.jpg" },

      // Phase 6
      { id: "m57", title: "蜘蛛人 4", date: "2026-07-24", phase: "Phase 6", poster: "https://image.tmdb.org/t/p/w500/sp4233c9959fE2e33rAGI1fC2ebf.jpg" },
      { id: "m58", title: "復仇者聯盟：末日崛起", date: "2026-12-10", phase: "Phase 6", poster: "https://image.tmdb.org/t/p/w500/a233c9959fE2e33rAGI1fC2ebfR2.jpg" },
      { id: "m59", title: "復仇者聯盟：秘密戰爭", date: "2027-05-07", phase: "Phase 6", poster: "https://image.tmdb.org/t/p/w500/sw233c9959fE2e33rAGI1fC2ebfR.jpg" }
    ];

    let currentFilter = 'all';

    function loadUserData() {
      const saved = localStorage.getItem('mcu_watchlist_v3');
      return saved ? JSON.parse(saved) : {};
    }

    function updateProgress() {
      const userData = loadUserData();
      const total = moviesData.length;
      let watchedCount = 0;

      moviesData.forEach(m => {
        if (userData[m.id] && userData[m.id].watched) {
          watchedCount++;
        }
      });

      const percentage = Math.round((watchedCount / total) * 100);
      document.getElementById('progressText').innerText = `${watchedCount} / ${total} (${percentage}%)`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function saveMovieRecord(movieId) {
      const isWatched = document.getElementById(`check-${movieId}`).checked;
      const watchDate = document.getElementById(`date-${movieId}`).value;
      const notes = document.getElementById(`notes-${movieId}`).value;

      const userData = loadUserData();
      userData[movieId] = {
        watched: isWatched,
        date: watchDate,
        notes: notes
      };

      localStorage.setItem('mcu_watchlist_v3', JSON.stringify(userData));
      
      const card = document.getElementById(`card-${movieId}`);
      if (isWatched) {
        card.classList.add('watched');
      } else {
        card.classList.remove('watched');
      }

      showToast();
      updateProgress();
    }

    function toggleForm(movieId) {
      const form = document.getElementById(`form-${movieId}`);
      form.classList.toggle('open');
    }

    function renderMovies() {
      const container = document.getElementById('phaseContainer');
      const userData = loadUserData();
      container.innerHTML = '';

      // 按照 Phase 進行分群
      const phases = ["Phase 1", "Phase 2", "Phase 3", "Phase 4", "Phase 5", "Phase 6"];

      phases.forEach(phase => {
        const phaseMovies = moviesData.filter(m => m.phase === phase);
        
        // 依據篩選條件計算要顯示的卡片
        const visibleMovies = phaseMovies.filter(movie => {
          const record = userData[movie.id] || { watched: false };
          if (currentFilter === 'watched') return record.watched;
          if (currentFilter === 'unwatched') return !record.watched;
          return true;
        });

        // 若該階段在目前篩選條件下沒有作品，則隱藏該階段區塊
        if (visibleMovies.length === 0) return;

        const phaseClass = phaseClassMap[phase];
        const phaseSection = document.createElement('div');
        phaseSection.className = 'phase-section';

        phaseSection.innerHTML = `
          <div class="phase-title">
            <span class="phase-title-tag ${phaseClass}">${phase}</span>
            <span>${phaseTitles[phase]}</span>
          </div>
          <div class="grid" id="grid-${phase.replace(/\s+/g, '')}"></div>
        `;

        container.appendChild(phaseSection);
        const grid = phaseSection.querySelector('.grid');

        visibleMovies.forEach(movie => {
          const record = userData[movie.id] || { watched: false, date: '', notes: '' };

          const card = document.createElement('div');
          card.className = `card ${record.watched ? 'watched' : ''}`;
          card.id = `card-${movie.id}`;

          card.innerHTML = `
            <div class="poster-container">
              <img src="${movie.poster}" class="poster-img" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x440/151720/ffffff?text=${encodeURIComponent(movie.title)}'">
              <span class="phase-badge ${phaseClass}">${movie.phase}</span>
              <span class="watched-tag">✓ 已觀看</span>
            </div>
            <div class="card-content">
              <div class="card-title">${movie.title}</div>
              <div class="release-date">${movie.date} 上映/首播</div>
              <button class="toggle-details-btn" onclick="toggleForm('${movie.id}')">紀錄 / 心得 ✎</button>
              <div class="details-form" id="form-${movie.id}">
                <label class="checkbox-label">
                  <input type="checkbox" id="check-${movie.id}" ${record.watched ? 'checked' : ''}>
                  已標記為已觀看
                </label>
                <div class="form-group">
                  <label>觀看日期</label>
                  <input type="date" id="date-${movie.id}" value="${record.date}">
                </div>
                <div class="form-group">
                  <label>觀後感紀錄</label>
                  <textarea id="notes-${movie.id}" placeholder="寫下你的心得...">${record.notes}</textarea>
                </div>
                <button class="save-btn" onclick="saveMovieRecord('${movie.id}')">儲存紀錄</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      });

      updateProgress();
    }

    function filterMovies(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    renderMovies();
  </script>
</body>
</html>
