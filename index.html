<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU 漫威電影觀影紀錄</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary-red: #e50914;
      --accent-gold: #f5c518;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--primary-red);
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .filter-btn {
      background: #252525;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-red);
      color: #fff;
      border-color: var(--primary-red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card.watched {
      border-color: var(--accent-gold);
    }

    .card-header {
      padding: 15px;
      background: #252525;
      border-bottom: 1px solid var(--border-color);
    }

    .phase-badge {
      font-size: 0.75rem;
      background: var(--accent-gold);
      color: #000;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0 0 4px 0;
    }

    .release-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-red);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="date"], textarea {
      background: #2b2b2b;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .save-btn {
      background: transparent;
      color: var(--primary-red);
      border: 1px solid var(--primary-red);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      margin-top: auto;
    }

    .save-btn:hover {
      background: var(--primary-red);
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-gold);
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MARVEL CINEMATIC UNIVERSE</h1>
      <p style="color: var(--text-muted);">大小姐的 MCU 觀影進度追蹤清單</p>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterMovies('all', this)">全部</button>
      <button class="filter-btn" onclick="filterMovies('watched', this)">已觀看</button>
      <button class="filter-btn" onclick="filterMovies('unwatched', this)">未觀看</button>
    </div>

    <div class="grid" id="movieGrid"></div>
  </div>

  <div id="toast" class="toast">儲存成功！</div>

  <script>
    // 漫威電影上映順序資料庫
    const moviesData = [
      { id: "m1", title: "鋼鐵人 (Iron Man)", date: "2008-04-30", phase: "Phase 1" },
      { id: "m2", title: "無敵浩克 (The Incredible Hulk)", date: "2008-06-13", phase: "Phase 1" },
      { id: "m3", title: "鋼鐵人 2 (Iron Man 2)", date: "2010-04-29", phase: "Phase 1" },
      { id: "m4", title: "雷神索爾 (Thor)", date: "2011-04-28", phase: "Phase 1" },
      { id: "m5", title: "美國隊長 (Captain America)", date: "2011-07-28", phase: "Phase 1" },
      { id: "m6", title: "復仇者聯盟 (The Avengers)", date: "2012-04-25", phase: "Phase 1" },
      { id: "m7", title: "鋼鐵人 3 (Iron Man 3)", date: "2013-04-24", phase: "Phase 2" },
      { id: "m8", title: "雷神索爾 2：黑暗世界", date: "2013-10-31", phase: "Phase 2" },
      { id: "m9", title: "美國隊長 2：酷寒戰士", date: "2014-03-27", phase: "Phase 2" },
      { id: "m10", title: "星際異攻隊 (Guardians of the Galaxy)", date: "2014-07-31", phase: "Phase 2" },
      { id: "m11", title: "復仇者聯盟 2：奧創紀元", date: "2015-04-22", phase: "Phase 2" },
      { id: "m12", title: "蟻人 (Ant-Man)", date: "2015-07-16", phase: "Phase 2" },
      { id: "m13", title: "美國隊長 3：英雄內戰", date: "2016-04-27", phase: "Phase 3" },
      { id: "m14", title: "奇異博士 (Doctor Strange)", date: "2016-10-25", phase: "Phase 3" },
      { id: "m15", title: "星際異攻隊 2", date: "2017-04-26", phase: "Phase 3" },
      { id: "m16", title: "蜘蛛人：返校日", date: "2017-07-05", phase: "Phase 3" },
      { id: "m17", title: "雷神索爾 3：諸神黃昏", date: "2017-10-26", phase: "Phase 3" },
      { id: "m18", title: "黑豹 (Black Panther)", date: "2018-02-13", phase: "Phase 3" },
      { id: "m19", title: "復仇者聯盟 3：無限之戰", date: "2018-04-25", phase: "Phase 3" },
      { id: "m20", title: "蟻人與黃蜂女", date: "2018-07-04", phase: "Phase 3" },
      { id: "m21", title: "驚奇隊長 (Captain Marvel)", date: "2019-03-06", phase: "Phase 3" },
      { id: "m22", title: "復仇者聯盟 4：終局之戰", date: "2019-04-24", phase: "Phase 3" },
      { id: "m23", title: "蜘蛛人：離家日", date: "2019-07-03", phase: "Phase 3" },
      { id: "m24", title: "黑寡婦 (Black Widow)", date: "2021-07-14", phase: "Phase 4" },
      { id: "m25", title: "尚氣與十環傳奇", date: "2021-09-02", phase: "Phase 4" },
      { id: "m26", title: "永恆族 (Eternals)", date: "2021-11-03", phase: "Phase 4" },
      { id: "m27", title: "蜘蛛人：無家日", date: "2021-12-15", phase: "Phase 4" },
      { id: "m28", title: "奇異博士 2：失控多重宇宙", date: "2022-05-04", phase: "Phase 4" },
      { id: "m29", title: "雷神索爾 4：愛與雷霆", date: "2022-07-06", phase: "Phase 4" },
      { id: "m30", title: "黑豹 2：瓦干達萬歲", date: "2022-11-09", phase: "Phase 4" }
    ];

    let currentFilter = 'all';

    function loadUserData() {
      const saved = localStorage.getItem('mcu_watchlist_data');
      return saved ? JSON.parse(saved) : {};
    }

    function saveMovieRecord(movieId) {
      const isWatched = document.getElementById(`check-${movieId}`).checked;
      const watchDate = document.getElementById(`date-${movieId}`).value;
      const notes = document.getElementById(`notes-${movieId}`).value;

      const userData = loadUserData();
      userData[movieId] = {
        watched: isWatched,
        date: watchDate,
        notes: notes
      };

      localStorage.setItem('mcu_watchlist_data', JSON.stringify(userData));
      
      const card = document.getElementById(`card-${movieId}`);
      if (isWatched) {
        card.classList.add('watched');
      } else {
        card.classList.remove('watched');
      }

      showToast();
      renderMovies();
    }

    function renderMovies() {
      const grid = document.getElementById('movieGrid');
      const userData = loadUserData();
      grid.innerHTML = '';

      moviesData.forEach(movie => {
        const record = userData[movie.id] || { watched: false, date: '', notes: '' };
        
        if (currentFilter === 'watched' && !record.watched) return;
        if (currentFilter === 'unwatched' && record.watched) return;

        const card = document.createElement('div');
        card.className = `card ${record.watched ? 'watched' : ''}`;
        card.id = `card-${movie.id}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="phase-badge">${movie.phase}</span>
            <div class="card-title">${movie.title}</div>
            <div class="release-date">上映日期：${movie.date}</div>
          </div>
          <div class="card-body">
            <label class="checkbox-group">
              <input type="checkbox" id="check-${movie.id}" ${record.watched ? 'checked' : ''}>
              已觀賞
            </label>
            <div class="form-group">
              <label>觀看日期</label>
              <input type="date" id="date-${movie.id}" value="${record.date}">
            </div>
            <div class="form-group">
              <label>觀後感 / 心得</label>
              <textarea id="notes-${movie.id}" placeholder="寫下你的心得或喜愛的片段...">${record.notes}</textarea>
            </div>
            <button class="save-btn" onclick="saveMovieRecord('${movie.id}')">儲存紀錄</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterMovies(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    renderMovies();
  </script>
</body>
</html>
